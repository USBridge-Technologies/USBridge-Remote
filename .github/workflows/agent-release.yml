name: agent-release

# Требуемые Repository Secrets для подписи/нотаризации macOS-сборки
# (Settings > Secrets and variables > Actions):
#   BUILD_CERTIFICATE_BASE64  - .p12 сертификат Developer ID Application, в Base64
#   P12_PASSWORD              - пароль, которым зашифрован .p12
#   NOTARIZATION_PASSWORD     - App-Specific Password Apple ID для notarytool
#   APPLE_ID                  - Apple ID разработчика (e-mail)
#   APPLE_TEAM_ID             - Team ID из Apple Developer аккаунта

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    env:
      USBRIDGE_SKIP_NOTARIZE: "1" # нотаризацию macOS проводим отдельными шагами ниже
      USBRIDGE_SKIP_TAILSCALE: "0"
      USBRIDGE_CODESIGN_IDENTITY: "Developer ID Application"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: matrix.name != 'windows'
        with:
          go-version-file: agent/go.mod

      - name: Import macOS signing certificate into a temporary keychain
        if: matrix.name == 'macos'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          # Отдельный keychain, чтобы не трогать системный login.keychain
          # раннера и не оставлять секреты между запусками.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install Linux build deps (Fyne/X11 + Sunshine runtime libs)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libminiupnpc-dev libva2 libva-drm2 libvdpau1 \
            libpulse0 libopus0 libcap2 libdrm2 libevdev2 \
            libxtst6 libxrandr2 libxfixes3 libnuma1 libcurl4 \
            libayatana-appindicator3-1 libssl3 \
            libpipewire-0.3-0 libwayland-client0 libwayland-egl1

      - name: Setup MSYS2 UCRT64 (Windows toolchain)
        if: matrix.name == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-python
            zip
            python

      - name: Build (Linux)
        if: matrix.name == 'linux'
        working-directory: agent
        run: ./scripts/build_linux.sh

      - name: Build (macOS)
        if: matrix.name == 'macos'
        working-directory: agent
        run: ./scripts/build_macos.sh

      - name: Notarize macOS app archive
        if: matrix.name == 'macos'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          set -euo pipefail

          # build_macos.sh называет архив с версией из ./VERSION
          # (USBridgeAgent-macOS-<version>.zip) — находим его вместо того,
          # чтобы жёстко зашивать имя файла.
          ARCHIVE="$(ls agent/dist/USBridgeAgent-macOS*.zip)"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          xcrun notarytool submit "$ARCHIVE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARIZATION_PASSWORD" \
            --wait

      - name: Staple notarization ticket to the app bundle
        if: matrix.name == 'macos'
        run: xcrun stapler staple "agent/dist/macos/USBridgeAgent.app"

      - name: Rebuild archive with the stapled ticket
        if: matrix.name == 'macos'
        run: |
          set -euo pipefail
          rm -f "$ARCHIVE"
          (cd agent/dist/macos && zip -r --symlinks "../$(basename "$ARCHIVE")" "USBridgeAgent.app" "README.txt")

      # Жёсткий гейт перед публикацией: билд не должен попасть в релиз, если
      # подпись отсутствует, невалидна, ad-hoc, либо тикет нотаризации не
      # приклеился. Каждая проверка ниже явно проваливает job (exit 1) в
      # соответствующем случае — полагаться только на коды возврата
      # инструментов недостаточно, т.к. codesign/spctl могут завершаться
      # успешно и для ad-hoc подписи.
      - name: Verify Developer ID signature & notarization (fail if ad-hoc/unsigned/not notarized)
        if: matrix.name == 'macos'
        run: |
          set -euo pipefail
          APP="agent/dist/macos/USBridgeAgent.app"

          echo "== codesign -dv: проверяем наличие и тип подписи =="
          if ! CODESIGN_INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)"; then
            echo "$CODESIGN_INFO"
            echo "::error::Приложение не подписано или подпись невалидна (codesign -dv завершился с ошибкой)"
            exit 1
          fi
          echo "$CODESIGN_INFO"

          if echo "$CODESIGN_INFO" | grep -q "^Signature=adhoc"; then
            echo "::error::Приложение подписано ad-hoc — сборка НЕ пригодна для распространения. Проверьте секреты BUILD_CERTIFICATE_BASE64/P12_PASSWORD и USBRIDGE_CODESIGN_IDENTITY."
            exit 1
          fi

          if ! echo "$CODESIGN_INFO" | grep -q "Authority=Developer ID Application"; then
            echo "::error::В подписи не найден Authority=Developer ID Application — сертификат не тот или не импортировался"
            exit 1
          fi

          echo "== codesign --verify --deep --strict: проверяем целостность подписи =="
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "== stapler validate: проверяем, что тикет нотаризации реально приклеен =="
          if ! xcrun stapler validate "$APP"; then
            echo "::error::Тикет нотаризации не приклеен к бандлу (stapler validate провалился)"
            exit 1
          fi

          echo "== spctl --assess: то же, что видит Gatekeeper на чужом Mac =="
          SPCTL_OUTPUT="$(spctl --assess --type execute -vv "$APP" 2>&1)" || {
            echo "$SPCTL_OUTPUT"
            echo "::error::Gatekeeper отклоняет приложение (spctl --assess завершился с ошибкой)"
            exit 1
          }
          echo "$SPCTL_OUTPUT"

          if ! echo "$SPCTL_OUTPUT" | grep -q "source=Notarized Developer ID"; then
            echo "::error::Gatekeeper не подтверждает нотаризованную подпись Developer ID (ожидали 'source=Notarized Developer ID', получили другое) — билд не готов к распространению"
            exit 1
          fi

          echo "✓ Подпись Developer ID подтверждена, приложение нотаризовано и тикет приклеен — готово к распространению."

      - name: Build (Windows, MSYS2 UCRT64)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        working-directory: agent
        run: ./scripts/build_windows.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.name }}
          path: |
            agent/dist/*.zip
            agent/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14

      # Гарантированно чистим временный keychain и сертификат даже при
      # падении предыдущих шагов, чтобы ничего не оставалось на раннере.
      - name: Remove temporary keychain
        if: always() && matrix.name == 'macos'
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find artifacts -type f \( -name '*.zip' -o -name '*.AppImage' \) -exec cp {} out/ \;
          ls -la out

      - name: Derive release version
        id: version
        # Тег вида "agent-v2.0.5" -> "v2.0.5", чтобы не дублировать "agent"
        # в имени релиза ("USBridge Agent agent-v2.0.5").
        run: echo "version=${GITHUB_REF_NAME#agent-}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          name: USBridge Agent ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
