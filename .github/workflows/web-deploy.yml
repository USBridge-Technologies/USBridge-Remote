# Builds and deploys the browser/WASM web client to Cloudflare (Worker +
# R2 -- see client/deploy/cloudflare-web/). Reusable (workflow_call, used by
# release-all.yml's client-web-deploy job on every real release) AND
# directly dispatchable (workflow_dispatch) so this exact deploy can be
# tested/re-run on its own without needing a full multi-platform release --
# useful right after rotating CLOUDFLARE_API_TOKEN or any of the other
# CLOUDFLARE_* secrets, to confirm they actually work before the next real
# release depends on them.
#
# All account-specific config (account id, R2 bucket, target domain) comes
# from repo secrets and is templated into wrangler.toml at deploy time --
# nothing account-identifying is committed anywhere in this repo.
name: web-deploy

on:
  workflow_call: {}
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build web client
        working-directory: client
        run: ./scripts/build_web.sh

      - name: Upload app.wasm to R2
        # app.wasm bypasses wrangler/the Worker's static assets entirely
        # (over Cloudflare's per-file size limit there) -- uploaded directly
        # via the R2 API instead; worker.js streams it back out on request.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          set -euo pipefail
          curl -sf -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/$CF_R2_BUCKET/objects/app.wasm" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/wasm" \
            --data-binary @client/web/app.wasm

      - name: Deploy Worker (static assets + custom domain)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CF_WEB_DOMAIN: ${{ secrets.CLOUDFLARE_WEB_DOMAIN }}
        run: |
          set -euo pipefail
          cd client/deploy/cloudflare-web
          mkdir -p public
          cp ../../web/index.html ../../web/gui.html ../../web/wasm_exec.js public/
          sed -e "s/__R2_BUCKET__/$CF_R2_BUCKET/" -e "s/__WEB_DOMAIN__/$CF_WEB_DOMAIN/" \
            wrangler.toml.template > wrangler.toml
          npx --yes wrangler@3 deploy
