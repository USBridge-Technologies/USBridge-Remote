name: release-all

# Single button (workflow_dispatch) that builds BOTH the agent (Linux/macOS/
# Windows) and the client (macOS/iOS/Linux/Windows/Android), signs and
# notarizes/submits where applicable, and publishes everything under ONE
# GitHub Release. Tag-triggered per-project releases (agent-v*/client-v*)
# still go through agent-release.yml/client-release.yml unchanged.
#
# Also exposed as a reusable workflow (workflow_call) so release-all-test.yml
# can trigger this exact same build matrix for a pre-release test build
# (prerelease: true, make_latest disabled, tag prefixed "test-") without
# duplicating any of the platform build steps.
#
# Repository Secrets required (Settings > Secrets and variables > Actions):
#   APPLE_ID, APPLE_TEAM_ID, NOTARIZATION_PASSWORD
#   BUILD_CERTIFICATE_BASE64 / P12_PASSWORD           - Developer ID Application
#                                                        (agent + client macOS)
#   IOS_BUILD_CERTIFICATE_BASE64                       - Apple Distribution
#                                                        (client iOS). Encrypted
#                                                        with the same P12_PASSWORD.
#   IOS_PROVISIONING_PROFILE_BASE64                    - client iOS distribution profile
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
#   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD           - client Android release
#                                                        signing key. Without these,
#                                                        build_android_gradle.sh falls
#                                                        back to an on-the-fly debug
#                                                        keystore that's regenerated
#                                                        (and re-signs with a new,
#                                                        different key) on every runner.
#   CLIENT_UPDATE_ED25519_PRIVATE_KEY                  - signs manifest-client.json,
#   AGENT_UPDATE_ED25519_PRIVATE_KEY                     signs manifest-agent.json
#                                                        (base64 32-byte Ed25519 seeds).
#                                                        Powers self-update on every
#                                                        platform except iOS — see
#                                                        client|agent/internal/update
#                                                        and scripts/sign_update_manifest.go.
#                                                        Unrelated to the codesigning
#                                                        certs above; generated
#                                                        separately, see
#                                                        ~/usbridge-update-keys/README.md
#                                                        (kept outside this repo).
#   PLAY_WIF_PROVIDER, PLAY_WIF_SERVICE_ACCOUNT        - Keyless auth to Google Play for
#                                                        client-android-market's publish step
#                                                        (Workload Identity Federation, not a
#                                                        downloadable service-account key —
#                                                        this GCP org enforces
#                                                        iam.disableServiceAccountKeyCreation,
#                                                        so no such key can exist). PROVIDER
#                                                        is the full
#                                                        projects/.../workloadIdentityPools/.../providers/...
#                                                        resource name; SERVICE_ACCOUNT is
#                                                        that pool's service account email
#                                                        (needs "Release manager" access on
#                                                        io.usbridge.client in Play Console).
#                                                        See google-github-actions/auth's
#                                                        README for the one-time gcloud setup
#                                                        (workload identity pool + OIDC
#                                                        provider scoped to this repo). Play's
#                                                        API refuses an app's very first
#                                                        release — this only works because
#                                                        io.usbridge.client already has at
#                                                        least one manually-uploaded release
#                                                        in Play Console.
#
# The Android client is built twice per release, from the same source, as two
# Gradle product flavors (client/android/app/build.gradle.kts):
#   - "direct" (client-android job): today's self-update-enabled APK,
#     unchanged, published to this GitHub Release.
#   - "market" (client-android-market job): no self-update, no
#     REQUEST_INSTALL_PACKAGES permission (client/internal/update/update_disabled.go)
#     — built as an .aab and uploaded to Google Play. Also the flavor
#     F-Droid's own build recipe should target once submitted there, since
#     F-Droid builds from source itself rather than taking a CI artifact.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag/name for the combined release (e.g. release-2026.07.15)"
        required: true
      prerelease:
        description: "Mark as a pre-release and skip setting it as /releases/latest (used for test builds)"
        required: false
        type: boolean
        default: false
  # Lets release-all-test.yml (and any other caller) reuse this entire build
  # matrix without duplicating it, just overriding the tag/prerelease flag.
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      prerelease:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ── Agent ────────────────────────────────────────────────────────────────

  agent-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
      - name: Install Linux build deps (Fyne/X11 + Sunshine runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libminiupnpc-dev libva2 libva-drm2 libvdpau1 \
            libpulse0 libopus0 libcap2 libdrm2 libevdev2 \
            libxtst6 libxrandr2 libxfixes3 libnuma1 libcurl4 \
            libayatana-appindicator3-1 libssl3 \
            libpipewire-0.3-0 libwayland-client0 libwayland-egl1
      - name: Build (Linux)
        working-directory: agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-agent-linux
          path: |
            agent/dist/*.zip
            agent/dist/*.AppImage
          if-no-files-found: error
          retention-days: 7

  agent-macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      USBRIDGE_CODESIGN_IDENTITY: "Developer ID Application"
      USBRIDGE_SKIP_NOTARIZE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Select latest available Xcode
        # The bundled Sunshine fork is built from source and occasionally
        # picks up C++20 features (e.g. std::jthread) that need a newer
        # libc++ than macos-14's default Xcode ships.
        run: |
          set -euo pipefail
          LATEST_XCODE="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' 2>/dev/null | sort -V | tail -1)"
          [ -n "$LATEST_XCODE" ] && sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - name: Import signing certificate into a temporary keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/agent-macos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build (macOS)
        working-directory: agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build_macos.sh

      - name: Notarize macOS app archive
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          set -euo pipefail
          ARCHIVE="$(ls agent/dist/USBridgeAgent-macOS*.dmg)"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          # `notarytool submit --wait` can hang indefinitely if Apple's
          # queue stalls, with only the job's blunt overall timeout-minutes
          # to eventually kill it and no visibility into why. Poll manually
          # with a bounded timeout per attempt and one retry instead.
          notarize_with_retry() {
            local archive="$1" attempt id status submit_json elapsed max_wait interval
            for attempt in 1 2; do
              echo "Notarization attempt $attempt/2..."
              submit_json="$(xcrun notarytool submit "$archive" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_NOTARIZATION_PASSWORD" --output-format json)"
              id="$(echo "$submit_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
              echo "Submission ID: $id"

              elapsed=0; max_wait=900; interval=20
              while [ "$elapsed" -lt "$max_wait" ]; do
                status="$(xcrun notarytool info "$id" \
                  --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                  --password "$APPLE_NOTARIZATION_PASSWORD" --output-format json \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
                echo "  [${elapsed}s] status: $status"
                case "$status" in
                  Accepted) return 0 ;;
                  Invalid|Rejected)
                    echo "::error::Notarization rejected (submission $id)"
                    xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARIZATION_PASSWORD" 2>/dev/null || true
                    return 1
                    ;;
                esac
                sleep "$interval"
                elapsed=$((elapsed + interval))
              done
              echo "::warning::Submission $id still '$status' after ${max_wait}s — retrying with a fresh submission"
            done
            echo "::error::Notarization did not complete after 2 attempts"
            return 1
          }
          notarize_with_retry "$ARCHIVE"

      - name: Staple notarization ticket
        # Staple the .app itself, not just the .dmg — if the ticket only
        # lives on the disk image, an app dragged out of it to /Applications
        # has no local ticket (Gatekeeper falls back to an online check).
        run: xcrun stapler staple "agent/dist/macos/USBridgeAgent.app"

      - name: Rebuild disk image with the stapled app
        run: |
          set -euo pipefail
          rm -f "$ARCHIVE"
          # hdiutil intermittently fails with "Resource busy" on GH Actions
          # runners — Spotlight/mdworker briefly locking the freshly-created file
          # or a not-yet-released mount from the previous hdiutil call in
          # build_macos.sh. Transient; a short retry clears it. Reuses the same
          # drag-to-Applications Finder layout build_macos.sh already applied
          # (agent/dist/macos/Applications symlink is already in place) so the
          # final notarized artifact keeps it too, instead of falling back to a
          # plain unlaid-out DMG. (create_dmg_with_drag_layout is defined
          # identically in agent/scripts/build_macos.sh — duplicated here
          # rather than sourced, since sourcing that script would re-run the
          # entire build. Uses `osascript -e` per line, not a heredoc — a
          # heredoc terminator here would inherit this step's YAML
          # indentation and never match, hanging the job.)
          create_dmg_with_drag_layout() {
              local volname="$1" src_dir="$2" output_dmg="$3" app_name="$4"
              local tmp_dmg mount_point
              tmp_dmg="$(mktemp -u "${TMPDIR:-/tmp}/${volname}-XXXXXX").dmg"
              mount_point="/Volumes/$volname"
              if hdiutil create -volname "$volname" -srcfolder "$src_dir" -ov -format UDRW -fs HFS+ "$tmp_dmg" >/dev/null 2>&1 \
                  && hdiutil attach "$tmp_dmg" -mountpoint "$mount_point" -nobrowse -quiet 2>/dev/null; then
                  osascript \
                      -e "tell application \"Finder\"" \
                      -e "tell disk \"$volname\"" \
                      -e "open" \
                      -e "set current view of container window to icon view" \
                      -e "set toolbar visible of container window to false" \
                      -e "set statusbar visible of container window to false" \
                      -e "set the bounds of container window to {400, 100, 940, 420}" \
                      -e "set viewOptions to the icon view options of container window" \
                      -e "set arrangement of viewOptions to not arranged" \
                      -e "set icon size of viewOptions to 96" \
                      -e "set position of item \"$app_name\" of container window to {130, 150}" \
                      -e "set position of item \"Applications\" of container window to {410, 150}" \
                      -e "close" \
                      -e "open" \
                      -e "update without registering applications" \
                      -e "delay 1" \
                      -e "end tell" \
                      -e "end tell" \
                      >/dev/null 2>&1 || true
                  hdiutil detach "$mount_point" -quiet 2>/dev/null || hdiutil detach "$mount_point" -force -quiet 2>/dev/null || true
                  rm -f "$output_dmg"
                  if hdiutil convert "$tmp_dmg" -format UDZO -o "$output_dmg" >/dev/null 2>&1; then
                      rm -f "$tmp_dmg"
                      return 0
                  fi
              fi
              hdiutil detach "$mount_point" -force -quiet 2>/dev/null || true
              rm -f "$tmp_dmg" "$output_dmg"
              hdiutil create -volname "$volname" -srcfolder "$src_dir" -ov -format UDZO "$output_dmg"
          }
          for attempt in 1 2 3; do
            create_dmg_with_drag_layout "USBridgeAgent" "agent/dist/macos" "$ARCHIVE" "USBridgeAgent.app" && break
            [ "$attempt" -eq 3 ] && { echo "::error::disk image rebuild failed after 3 attempts"; exit 1; }
            echo "::warning::disk image rebuild failed (attempt $attempt/3) — retrying in 10s"
            sleep 10
          done

      - name: Verify Developer ID signature & notarization
        run: |
          set -euo pipefail
          APP="agent/dist/macos/USBridgeAgent.app"
          CODESIGN_INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)" || { echo "$CODESIGN_INFO"; echo "::error::codesign -dv failed"; exit 1; }
          echo "$CODESIGN_INFO" | grep -q "^Signature=adhoc" && { echo "::error::ad-hoc signed"; exit 1; }
          echo "$CODESIGN_INFO" | grep -q "Authority=Developer ID Application" || { echo "::error::wrong cert"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP" || { echo "::error::ticket not stapled"; exit 1; }
          SPCTL_OUTPUT="$(spctl --assess --type execute -vv "$APP" 2>&1)" || { echo "$SPCTL_OUTPUT"; echo "::error::spctl rejected"; exit 1; }
          echo "$SPCTL_OUTPUT" | grep -q "source=Notarized Developer ID" || { echo "::error::not notarized"; exit 1; }
          echo "✓ agent macOS ready to distribute"

      - uses: actions/upload-artifact@v4
        with:
          name: release-agent-macos
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"

  agent-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-python
            zip
            python
      - name: Build (Windows, MSYS2 UCRT64)
        shell: msys2 {0}
        working-directory: agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-agent-windows
          path: agent/dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # ── Client ───────────────────────────────────────────────────────────────

  client-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libavcodec-dev libavutil-dev libswscale-dev libpulse-dev \
            libopus-dev libssl-dev pkg-config cmake libvulkan-dev
      - name: Build (Linux)
        # build_linux.sh packages an AppImage directly (client/dist/USBridgeClient-Linux-x86_64-<VERSION>.AppImage),
        # bundling libavcodec/libpulse/libopus/etc. via linuxdeploy — no separate
        # archive step needed, same as the agent's Linux build.
        working-directory: client
        run: ./scripts/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-client-linux
          path: client/dist/USBridgeClient-Linux-x86_64-*.AppImage
          if-no-files-found: error
          retention-days: 7

  client-windows:
    # Ubuntu's mingw-w64 apt package rejects -mthreads (which Go's cgo
    # toolchain passes unconditionally when cross-compiling runtime/cgo for
    # windows/amd64), in both its -win32 and -posix gcc variants. MSYS2's
    # mingw-w64-ucrt-x86_64-gcc — the same toolchain agent-windows already
    # builds with successfully — does not have this problem, so build
    # natively there instead of cross-compiling from Linux.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-go
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            zip
      - name: Shim cross-compiler binary names
        # build_windows.sh looks for x86_64-w64-mingw32-{gcc,g++,pkg-config}
        # (the Debian/Ubuntu cross-compiler naming convention). Under MSYS2
        # UCRT64 there's no separate host-vs-target toolchain — the native
        # gcc/g++/pkg-config already target Windows — so just alias them.
        shell: msys2 {0}
        run: |
          set -euo pipefail
          BIN_DIR="$HOME/bin-shim"
          mkdir -p "$BIN_DIR"
          for pair in gcc:x86_64-w64-mingw32-gcc g++:x86_64-w64-mingw32-g++ pkg-config:x86_64-w64-mingw32-pkg-config; do
            real="${pair%%:*}"; shim="${pair##*:}"
            printf '#!/bin/bash\nexec %s "$@"\n' "$real" > "$BIN_DIR/$shim"
            chmod +x "$BIN_DIR/$shim"
          done
          echo "$BIN_DIR" >> "$GITHUB_PATH"
      - name: Build (Windows, MSYS2 UCRT64)
        shell: msys2 {0}
        working-directory: client
        run: ./scripts/build_windows.sh
      - name: Dump build log on failure
        if: failure()
        shell: msys2 {0}
        run: cat client/logs/build_windows.log 2>/dev/null || echo "no log file found"
      - name: Package into a single archive
        # dist/windows/ is a portable app folder (exe + launcher + all DLLs
        # + bundled Tailscale runtime alongside) — that's correct, it's meant
        # to run standalone with no external deps. Zip the whole folder as
        # one file so those don't end up as loose release assets.
        shell: msys2 {0}
        run: |
          set -euo pipefail
          VERSION="$(cat client/VERSION 2>/dev/null || echo 1.0.0)"
          (cd client/dist/windows && zip -r "../USBridgeClient-Windows-x86_64-${VERSION}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: release-client-windows
          path: client/dist/USBridgeClient-Windows-x86_64-*.zip
          if-no-files-found: error
          retention-days: 7

  client-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Moonlight Core for Android
        # build_android_gradle.sh does not build moonlight-common-c/opus itself
        # (unlike build_ios.sh) — it expects this to already be cached from a
        # prior local run. Do it explicitly here, same env vars build_ios.sh
        # uses for its own platform.
        working-directory: client
        run: |
          set -euo pipefail
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)"
          [ -z "$NDK_DIR" ] && { echo "::error::No Android NDK found under \$ANDROID_HOME/ndk"; exit 1; }
          export ANDROID_NDK_HOME="$NDK_DIR"
          echo "Using NDK: $ANDROID_NDK_HOME"
          MOONLIGHT_ANDROID_TARGET=1 MOONLIGHT_SKIP_HOST=1 ./scripts/build_moonlight.sh
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/usbridge-release.keystore"
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build (Android, Moonlight-only, release-signed, self-update on)
        # build_android_gradle.sh now defaults to the "market" flavor (no
        # self-update) — this is the one job that explicitly opts back into
        # the "direct" flavor's self-update flow, so the off-market APK
        # published to this GitHub Release keeps behaving exactly as before.
        working-directory: client
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WITH_SELF_UPDATE: "1"
        run: ./scripts/build_android_gradle.sh

      - name: Verify release signature
        # Mirrors the macOS/iOS "Verify ... signature" steps: fail the job
        # instead of silently shipping an APK that fell back to the
        # auto-generated debug keystore (which would break users' upgrade
        # path, since Android refuses to install an update signed by a
        # different key than the one already installed).
        run: |
          set -euo pipefail
          APK="$(ls client/dist/android/USBridgeClient-Android-*.apk)"
          echo "APK=$APK" >> "$GITHUB_ENV"
          NDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)"
          APKSIGNER="$NDK_BUILD_TOOLS/apksigner"
          "$APKSIGNER" verify --print-certs "$APK"
          CERT_INFO="$(keytool -printcert -jarfile "$APK" 2>&1)"
          echo "$CERT_INFO" | grep -E "Owner|SHA256"
          echo "$CERT_INFO" | grep -q "CN=Android Debug" && { echo "::error::APK is signed with the auto-generated debug keystore, not the release key — check ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS/ANDROID_KEY_PASSWORD secrets"; exit 1; }
          echo "✓ client Android signed with release key"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${ANDROID_KEYSTORE_PATH:-}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-client-android
          # The APK is fully self-contained (no loose deps to bundle
          # alongside), so upload it directly rather than the whole dir.
          path: client/dist/android/USBridgeClient-Android-*.apk
          if-no-files-found: error

  client-android-market:
    name: Android (market flavor .aab, no self-update, → Play Store)
    runs-on: ubuntu-latest
    # id-token: write is what lets google-github-actions/auth mint the OIDC
    # token this job trades for short-lived Google credentials (Workload
    # Identity Federation) — no downloadable service-account key involved,
    # since this GCP org enforces iam.disableServiceAccountKeyCreation.
    # Job-level permissions replace, not merge with, the workflow-level
    # block above, so contents: read is repeated here for checkout.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build Moonlight Core for Android
        working-directory: client
        run: |
          set -euo pipefail
          NDK_DIR="$(find "$ANDROID_HOME/ndk" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)"
          [ -z "$NDK_DIR" ] && { echo "::error::No Android NDK found under \$ANDROID_HOME/ndk"; exit 1; }
          export ANDROID_NDK_HOME="$NDK_DIR"
          echo "Using NDK: $ANDROID_NDK_HOME"
          MOONLIGHT_ANDROID_TARGET=1 MOONLIGHT_SKIP_HOST=1 ./scripts/build_moonlight.sh

      - name: Decode release keystore
        # Same release key as the "direct" flavor (client-android job) —
        # Gradle uses it directly (signingConfigs.release in
        # app/build.gradle.kts) to sign the .aab this job produces, since
        # Play requires a signed bundle.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/usbridge-release.keystore"
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build (Android, market flavor, .aab, no self-update)
        working-directory: client
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WITH_AAB: "1"
        run: ./scripts/build_android_gradle.sh

      - name: Verify release AAB signature
        # jarsigner/keytool read an .aab's signature the same way they read
        # an APK's (it's still a signed zip container) — apksigner itself
        # is APK-only and can't be used here.
        run: |
          set -euo pipefail
          AAB="$(ls client/dist/android/USBridgeClient-Android-arm64-market-*.aab)"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          # No -strict: a self-signed cert (every Android app-signing key)
          # otherwise reads as a verification "error" to jarsigner.
          jarsigner -verify "$AAB"
          CERT_INFO="$(keytool -printcert -jarfile "$AAB" 2>&1)"
          echo "$CERT_INFO" | grep -E "Owner|SHA256"
          echo "$CERT_INFO" | grep -q "CN=Android Debug" && { echo "::error::AAB is signed with the auto-generated debug keystore, not the release key — check ANDROID_KEYSTORE_BASE64/ANDROID_KEYSTORE_PASSWORD/ANDROID_KEY_ALIAS/ANDROID_KEY_PASSWORD secrets"; exit 1; }
          echo "✓ market AAB signed with release key"

      - name: Verify release APK signature
        # The market flavor's assemble task runs unconditionally (WITH_AAB
        # only adds the bundle task on top) and produces a real,
        # apksigner-signed APK too — published for self-built third-party
        # repos (IzzyOnDroid) and as a reference build for the official
        # F-Droid recipe, neither of which want the .aab (F-Droid doesn't
        # build/accept AAB at all — see docs/AUTO_UPDATE.md's neighbors).
        run: |
          set -euo pipefail
          APK="$(ls client/dist/android/USBridgeClient-Android-arm64-market-*.apk)"
          echo "MARKET_APK=$APK" >> "$GITHUB_ENV"
          NDK_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -1)"
          "$NDK_BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          CERT_INFO="$(keytool -printcert -jarfile "$APK" 2>&1)"
          echo "$CERT_INFO" | grep -E "Owner|SHA256"
          echo "$CERT_INFO" | grep -q "CN=Android Debug" && { echo "::error::market APK is signed with the auto-generated debug keystore, not the release key"; exit 1; }
          echo "✓ market APK signed with release key"

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${ANDROID_KEYSTORE_PATH:-}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-client-android-market
          # Both the .aab (Play Store) and the plain APK (IzzyOnDroid /
          # F-Droid reference — F-Droid itself builds its own from source,
          # but doesn't accept or build .aab either way).
          path: |
            client/dist/android/USBridgeClient-Android-arm64-market-*.aab
            client/dist/android/USBridgeClient-Android-arm64-market-*.apk
          if-no-files-found: error

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        # No service-account key file involved — this org enforces
        # iam.disableServiceAccountKeyCreation, so one can't even be created.
        # This mints short-lived Google credentials by trading the job's own
        # GitHub OIDC token (id-token: write above) for them, scoped to the
        # PLAY_WIF_SERVICE_ACCOUNT via the workload identity pool/provider
        # set up for this exact repo.
        if: ${{ !inputs.prerelease }}
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.PLAY_WIF_PROVIDER }}
          service_account: ${{ secrets.PLAY_WIF_SERVICE_ACCOUNT }}

      - name: Publish to Google Play (production track)
        # Skipped for prerelease/test builds (release-all-test.yml, tags
        # prefixed "test-") — those should never auto-publish to real users.
        # The .aab still gets built and verified above either way; it's
        # just this one step, the actual Play Console upload, that's gated.
        if: ${{ !inputs.prerelease }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ steps.gcp-auth.outputs.credentials_file_path }}
          packageName: io.usbridge.client
          releaseFiles: client/dist/android/USBridgeClient-Android-arm64-market-*.aab
          track: production
          status: completed
          retention-days: 7

  client-macos:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      USBRIDGE_CODESIGN_IDENTITY: "Developer ID Application"
      USBRIDGE_SKIP_NOTARIZE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod

      - name: Import signing certificate into a temporary keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/client-macos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install macOS build dependencies
        run: |
          brew list opus &>/dev/null || brew install opus

      - name: Build & sign macOS app bundle
        working-directory: client
        run: ./scripts/build_macos.sh

      - name: Notarize macOS app archive
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          set -euo pipefail
          ARCHIVE="$(ls client/dist/USBridgeClient-macOS*.dmg)"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          # `notarytool submit --wait` can hang indefinitely if Apple's
          # queue stalls, with only the job's blunt overall timeout-minutes
          # to eventually kill it and no visibility into why. Poll manually
          # with a bounded timeout per attempt and one retry instead.
          notarize_with_retry() {
            local archive="$1" attempt id status submit_json elapsed max_wait interval
            for attempt in 1 2; do
              echo "Notarization attempt $attempt/2..."
              submit_json="$(xcrun notarytool submit "$archive" \
                --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_NOTARIZATION_PASSWORD" --output-format json)"
              id="$(echo "$submit_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
              echo "Submission ID: $id"

              elapsed=0; max_wait=900; interval=20
              while [ "$elapsed" -lt "$max_wait" ]; do
                status="$(xcrun notarytool info "$id" \
                  --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
                  --password "$APPLE_NOTARIZATION_PASSWORD" --output-format json \
                  | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
                echo "  [${elapsed}s] status: $status"
                case "$status" in
                  Accepted) return 0 ;;
                  Invalid|Rejected)
                    echo "::error::Notarization rejected (submission $id)"
                    xcrun notarytool log "$id" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_NOTARIZATION_PASSWORD" 2>/dev/null || true
                    return 1
                    ;;
                esac
                sleep "$interval"
                elapsed=$((elapsed + interval))
              done
              echo "::warning::Submission $id still '$status' after ${max_wait}s — retrying with a fresh submission"
            done
            echo "::error::Notarization did not complete after 2 attempts"
            return 1
          }
          notarize_with_retry "$ARCHIVE"

      - name: Staple notarization ticket
        # Staple the .app itself, not just the .dmg — if the ticket only
        # lives on the disk image, an app dragged out of it to /Applications
        # has no local ticket (Gatekeeper falls back to an online check).
        run: xcrun stapler staple "client/dist/macos/USBridgeClient.app"

      - name: Rebuild disk image with the stapled app
        run: |
          set -euo pipefail
          rm -f "$ARCHIVE"
          # hdiutil intermittently fails with "Resource busy" on GH Actions
          # runners — Spotlight/mdworker briefly locking the freshly-created file
          # or a not-yet-released mount from the previous hdiutil call in
          # build_macos.sh. Transient; a short retry clears it. Reuses the same
          # drag-to-Applications Finder layout build_macos.sh already applied
          # (client/dist/macos/Applications symlink is already in place) so the
          # final notarized artifact keeps it too, instead of falling back to a
          # plain unlaid-out DMG. (create_dmg_with_drag_layout is defined
          # identically in client/scripts/build_macos.sh — duplicated here
          # rather than sourced, since sourcing that script would re-run the
          # entire build. Uses `osascript -e` per line, not a heredoc — a
          # heredoc terminator here would inherit this step's YAML
          # indentation and never match, hanging the job.)
          create_dmg_with_drag_layout() {
              local volname="$1" src_dir="$2" output_dmg="$3" app_name="$4"
              local tmp_dmg mount_point
              tmp_dmg="$(mktemp -u "${TMPDIR:-/tmp}/${volname}-XXXXXX").dmg"
              mount_point="/Volumes/$volname"
              if hdiutil create -volname "$volname" -srcfolder "$src_dir" -ov -format UDRW -fs HFS+ "$tmp_dmg" >/dev/null 2>&1 \
                  && hdiutil attach "$tmp_dmg" -mountpoint "$mount_point" -nobrowse -quiet 2>/dev/null; then
                  osascript \
                      -e "tell application \"Finder\"" \
                      -e "tell disk \"$volname\"" \
                      -e "open" \
                      -e "set current view of container window to icon view" \
                      -e "set toolbar visible of container window to false" \
                      -e "set statusbar visible of container window to false" \
                      -e "set the bounds of container window to {400, 100, 940, 420}" \
                      -e "set viewOptions to the icon view options of container window" \
                      -e "set arrangement of viewOptions to not arranged" \
                      -e "set icon size of viewOptions to 96" \
                      -e "set position of item \"$app_name\" of container window to {130, 150}" \
                      -e "set position of item \"Applications\" of container window to {410, 150}" \
                      -e "close" \
                      -e "open" \
                      -e "update without registering applications" \
                      -e "delay 1" \
                      -e "end tell" \
                      -e "end tell" \
                      >/dev/null 2>&1 || true
                  hdiutil detach "$mount_point" -quiet 2>/dev/null || hdiutil detach "$mount_point" -force -quiet 2>/dev/null || true
                  rm -f "$output_dmg"
                  if hdiutil convert "$tmp_dmg" -format UDZO -o "$output_dmg" >/dev/null 2>&1; then
                      rm -f "$tmp_dmg"
                      return 0
                  fi
              fi
              hdiutil detach "$mount_point" -force -quiet 2>/dev/null || true
              rm -f "$tmp_dmg" "$output_dmg"
              hdiutil create -volname "$volname" -srcfolder "$src_dir" -ov -format UDZO "$output_dmg"
          }
          for attempt in 1 2 3; do
            create_dmg_with_drag_layout "USBridgeClient" "client/dist/macos" "$ARCHIVE" "USBridgeClient.app" && break
            [ "$attempt" -eq 3 ] && { echo "::error::disk image rebuild failed after 3 attempts"; exit 1; }
            echo "::warning::disk image rebuild failed (attempt $attempt/3) — retrying in 10s"
            sleep 10
          done

      - name: Verify Developer ID signature & notarization
        run: |
          set -euo pipefail
          APP="client/dist/macos/USBridgeClient.app"
          CODESIGN_INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)" || { echo "$CODESIGN_INFO"; echo "::error::codesign -dv failed"; exit 1; }
          echo "$CODESIGN_INFO" | grep -q "^Signature=adhoc" && { echo "::error::ad-hoc signed"; exit 1; }
          echo "$CODESIGN_INFO" | grep -q "Authority=Developer ID Application" || { echo "::error::wrong cert"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP" || { echo "::error::ticket not stapled"; exit 1; }
          SPCTL_OUTPUT="$(spctl --assess --type execute -vv "$APP" 2>&1)" || { echo "$SPCTL_OUTPUT"; echo "::error::spctl rejected"; exit 1; }
          echo "$SPCTL_OUTPUT" | grep -q "source=Notarized Developer ID" || { echo "::error::not notarized"; exit 1; }
          echo "✓ client macOS ready to distribute"

      - uses: actions/upload-artifact@v4
        with:
          name: release-client-macos
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary keychain
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"

  client-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select latest available Xcode
        run: |
          set -euo pipefail
          LATEST_XCODE="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' 2>/dev/null | sort -V | tail -1)"
          [ -n "$LATEST_XCODE" ] && sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - uses: actions/setup-go@v5
        with:
          go-version-file: client/go.mod

      - name: Import signing certificate into a temporary keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/client-ios-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install iOS provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/USBridgeClient.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/USBridgeClient.mobileprovision.plist"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(xmllint --xpath '//key[.="UUID"]/following-sibling::string[1]/text()' "$PROFILE_PLIST")"
          [ -z "$PROFILE_UUID" ] && { echo "::error::Could not extract UUID"; exit 1; }
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp "$PROFILE_PATH" "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"
          rm -f "$PROFILE_PATH" "$PROFILE_PLIST"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.2

      - name: Build & sign iOS .ipa
        working-directory: client
        run: ./scripts/build_ios.sh

      - name: Verify Apple Distribution signature
        run: |
          set -euo pipefail
          IPA="$(ls client/dist/ios/*.ipa)"
          echo "IPA=$IPA" >> "$GITHUB_ENV"
          EXTRACT_DIR="$RUNNER_TEMP/ipa-verify"
          rm -rf "$EXTRACT_DIR"; mkdir -p "$EXTRACT_DIR"
          unzip -q "$IPA" -d "$EXTRACT_DIR"
          APP="$(find "$EXTRACT_DIR/Payload" -maxdepth 1 -name "*.app" | head -1)"
          [ -z "$APP" ] && { echo "::error::no .app in ipa"; exit 1; }
          [ -f "$APP/embedded.mobileprovision" ] || { echo "::error::no embedded profile"; exit 1; }
          CODESIGN_INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)" || { echo "$CODESIGN_INFO"; echo "::error::codesign -dv failed"; exit 1; }
          echo "$CODESIGN_INFO" | grep -q "^Signature=adhoc" && { echo "::error::ad-hoc signed"; exit 1; }
          echo "$CODESIGN_INFO" | grep -q "Authority=Apple Distribution" || { echo "::error::wrong cert"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          rm -rf "$EXTRACT_DIR"
          echo "✓ client iOS ready to submit"

      - uses: actions/upload-artifact@v4
        with:
          name: release-client-ios
          path: ${{ env.IPA }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun altool --upload-app --type ios -f "$IPA" -u "$APPLE_ID" -p "$APPLE_NOTARIZATION_PASSWORD" --team-id "$APPLE_TEAM_ID"

      - name: Remove temporary keychain & provisioning profile
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          [ -n "${PROFILE_UUID:-}" ] && rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" || true

  # ── Combined release ────────────────────────────────────────────────────

  release:
    needs:
      - agent-linux
      - agent-macos
      - agent-windows
      - client-linux
      - client-windows
      - client-android
      - client-android-market
      - client-macos
      - client-ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Needed for scripts/sign_update_manifest.go and agent/VERSION,
        # client/VERSION below — this job otherwise only ever touched
        # downloaded artifacts, no repo checkout.

      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        # Each release-* artifact now contains exactly one packaged file
        # (built by the corresponding job's own "Package into a single
        # archive" step, or a single .dmg/.ipa/.apk) — no extension
        # filtering needed, and nothing else can sneak in as a loose file.
        #
        # Strip the "-X.Y.Z" version segment from the published asset name:
        # the version already lives on the release itself (tag + title), and
        # GitHub release assets are physical uploads with no alias/symlink
        # mechanism — keeping the name stable means /releases/latest/download/
        # <name> always points at the newest build without ever changing,
        # instead of needing a second duplicate upload per platform.
        run: |
          mkdir -p out
          find artifacts -mindepth 2 -maxdepth 2 -type f -exec cp {} out/ \;
          for f in out/*; do
            stable="$(echo "$f" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+(\.[A-Za-z0-9]+)$/\1/')"
            [ "$f" != "$stable" ] && mv "$f" "$stable"
          done
          ls -la out

      - name: Sign auto-update manifests (client + agent)
        # Powers internal/update's self-update check in both apps (every
        # platform except iOS, which has no artifact here and no self-update
        # path — see client/internal/update's package doc). Signs with
        # Ed25519 private keys that exist only as GitHub Actions secrets;
        # see ~/usbridge-update-keys/README.md (outside this repo) for how
        # those secrets were provisioned and how to rotate them.
        env:
          CLIENT_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.CLIENT_UPDATE_ED25519_PRIVATE_KEY }}
          AGENT_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.AGENT_UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          CLIENT_VERSION="$(tr -d ' \t\n\r' < client/VERSION)"
          AGENT_VERSION="$(tr -d ' \t\n\r' < agent/VERSION)"

          UPDATE_SIGNING_KEY="$CLIENT_UPDATE_ED25519_PRIVATE_KEY" go run scripts/sign_update_manifest.go \
            -app client -version "$CLIENT_VERSION" -dir out \
            -manifest-out out/manifest-client.json -sig-out out/manifest-client.json.sig

          UPDATE_SIGNING_KEY="$AGENT_UPDATE_ED25519_PRIVATE_KEY" go run scripts/sign_update_manifest.go \
            -app agent -version "$AGENT_VERSION" -dir out \
            -manifest-out out/manifest-agent.json -sig-out out/manifest-agent.json.sig

      - name: Create combined GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: out/*
          name: USBridge ${{ inputs.release_tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ inputs.prerelease }}
          # This is the one release that should own /releases/latest when it's
          # a real release — agent-release.yml/client-release.yml explicitly
          # opt out of it too, and a prerelease (test) build must never take
          # over /releases/latest from the last real release.
          make_latest: ${{ inputs.prerelease && 'false' || 'true' }}
