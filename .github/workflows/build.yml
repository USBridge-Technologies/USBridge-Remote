name: build

# Ручной прогон сборки/подписи/нотаризации macOS-приложения USBridgeAgent —
# для проверки credentials и pipeline без создания реального релиза.
# Автоматический релиз по тегу agent-v* делает agent-release.yml (там та же
# логика подписи/нотаризации встроена в macOS-джобу matrix'а).
#
# Требуемые Repository Secrets (Settings > Secrets and variables > Actions):
#   BUILD_CERTIFICATE_BASE64  - .p12 сертификат Developer ID Application, в Base64
#                               (получить: base64 -i Certificate.p12 | pbcopy)
#   P12_PASSWORD              - пароль, которым зашифрован .p12
#   NOTARIZATION_PASSWORD     - App-Specific Password Apple ID для notarytool
#   APPLE_ID                  - Apple ID разработчика (e-mail), см. account.apple.com
#   APPLE_TEAM_ID             - Team ID из Apple Developer аккаунта (developer.apple.com/account)

on:
  workflow_dispatch: {}

# Токен по умолчанию используется только для checkout — write-доступ не нужен.
permissions:
  contents: read

jobs:
  build-macos:
    name: Build, sign & notarize (macOS)
    # macos-14 = Apple Silicon (arm64). Возьмите macos-latest, если архитектура
    # раннера не важна для сборки.
    runs-on: macos-14
    timeout-minutes: 30

    env:
      # Подписываем сборку сертификатом, который импортируем ниже во временный
      # keychain. Строка достаточна, т.к. в keychain будет ровно один
      # сертификат с классом "Developer ID Application".
      USBRIDGE_CODESIGN_IDENTITY: "Developer ID Application"
      # Нотаризацию проводим отдельным шагом ниже (через notarytool submit
      # напрямую), поэтому встроенный в скрипт keychain-profile flow пропускаем.
      USBRIDGE_SKIP_NOTARIZE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # go.mod фиксирует актуальную версию тулчейна (>= 1.21 по требованиям проекта).
          go-version-file: agent/go.mod

      - name: Import signing certificate into a temporary keychain
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          # Случайный пароль keychain нужен только на время job — наружу он не идёт.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          # Декодируем сертификат во временный файл в $RUNNER_TEMP (стирается
          # раннером после job'а; дополнительно удаляем его сами ниже).
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          # Создаём отдельный keychain, чтобы не трогать системный login.keychain
          # раннера и не оставлять секреты между запусками.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"

          # Разрешаем codesign/xcrun использовать импортированный ключ без
          # интерактивного подтверждения доступа.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Делаем наш keychain видимым для codesign в текущей сессии.
          security list-keychain -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$KEYCHAIN_PATH"

          # Сертификат нам больше не нужен в виде файла — сразу удаляем.
          rm -f "$CERT_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Build & sign macOS app bundle
        working-directory: agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/build_macos.sh

      - name: Notarize app archive
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        run: |
          set -euo pipefail

          # build_macos.sh называет архив с версией из ./VERSION
          # (USBridgeAgent-macOS-<version>.zip) — находим его вместо того,
          # чтобы жёстко зашивать имя файла.
          ARCHIVE="$(ls agent/dist/USBridgeAgent-macOS*.zip)"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

          xcrun notarytool submit "$ARCHIVE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARIZATION_PASSWORD" \
            --wait

      - name: Staple notarization ticket to the app bundle
        run: xcrun stapler staple "agent/dist/macos/USBridgeAgent.app"

      - name: Rebuild archive with the stapled ticket
        run: |
          set -euo pipefail
          rm -f "$ARCHIVE"
          (cd agent/dist/macos && zip -r --symlinks "../$(basename "$ARCHIVE")" "USBridgeAgent.app" "README.txt")

      # Жёсткий гейт перед публикацией артефакта: билд не должен пройти, если
      # подпись отсутствует, невалидна, ad-hoc, либо тикет нотаризации не
      # приклеился. Каждая проверка ниже явно проваливает job (exit 1) в
      # соответствующем случае — полагаться только на коды возврата
      # инструментов недостаточно, т.к. codesign/spctl могут завершаться
      # успешно и для ad-hoc подписи.
      - name: Verify Developer ID signature & notarization (fail if ad-hoc/unsigned/not notarized)
        run: |
          set -euo pipefail
          APP="agent/dist/macos/USBridgeAgent.app"

          echo "== codesign -dv: проверяем наличие и тип подписи =="
          if ! CODESIGN_INFO="$(codesign -dv --verbose=4 "$APP" 2>&1)"; then
            echo "$CODESIGN_INFO"
            echo "::error::Приложение не подписано или подпись невалидна (codesign -dv завершился с ошибкой)"
            exit 1
          fi
          echo "$CODESIGN_INFO"

          if echo "$CODESIGN_INFO" | grep -q "^Signature=adhoc"; then
            echo "::error::Приложение подписано ad-hoc — сборка НЕ пригодна для распространения. Проверьте секреты BUILD_CERTIFICATE_BASE64/P12_PASSWORD и USBRIDGE_CODESIGN_IDENTITY."
            exit 1
          fi

          if ! echo "$CODESIGN_INFO" | grep -q "Authority=Developer ID Application"; then
            echo "::error::В подписи не найден Authority=Developer ID Application — сертификат не тот или не импортировался"
            exit 1
          fi

          echo "== codesign --verify --deep --strict: проверяем целостность подписи =="
          codesign --verify --deep --strict --verbose=2 "$APP"

          echo "== stapler validate: проверяем, что тикет нотаризации реально приклеен =="
          if ! xcrun stapler validate "$APP"; then
            echo "::error::Тикет нотаризации не приклеен к бандлу (stapler validate провалился)"
            exit 1
          fi

          echo "== spctl --assess: то же, что видит Gatekeeper на чужом Mac =="
          SPCTL_OUTPUT="$(spctl --assess --type execute -vv "$APP" 2>&1)" || {
            echo "$SPCTL_OUTPUT"
            echo "::error::Gatekeeper отклоняет приложение (spctl --assess завершился с ошибкой)"
            exit 1
          }
          echo "$SPCTL_OUTPUT"

          if ! echo "$SPCTL_OUTPUT" | grep -q "source=Notarized Developer ID"; then
            echo "::error::Gatekeeper не подтверждает нотаризованную подпись Developer ID (ожидали 'source=Notarized Developer ID', получили другое) — билд не готов к распространению"
            exit 1
          fi

          echo "✓ Подпись Developer ID подтверждена, приложение нотаризовано и тикет приклеен — готово к распространению."

      - name: Upload signed & notarized artifact
        uses: actions/upload-artifact@v4
        with:
          name: USBridgeAgent-macOS
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 14

      # Гарантированно чистим временный keychain и сертификат даже при
      # падении предыдущих шагов, чтобы ничего не оставалось на раннере.
      - name: Remove temporary keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"
