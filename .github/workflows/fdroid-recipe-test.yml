name: fdroid-recipe-test

# TEMPORARY scratch workflow to validate docs/fdroid/io.usbridge.client.yml's
# init/prebuild/gradle steps on real x86_64 hardware (matching F-Droid's
# actual buildserver architecture) without fighting local QEMU emulation.
# Not meant to stay in the repo long-term -- delete once the recipe works.

on:
  workflow_dispatch: {}
  push:
    branches: [test]
    paths:
      - ".github/workflows/fdroid-recipe-test.yml"
      - "docs/fdroid/io.usbridge.client.yml"

jobs:
  test-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Android SDK platform/build-tools/NDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-26" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: "init step (recipe's init section)"
        run: |
          set -euo pipefail
          curl -sSL https://go.dev/dl/go1.25.12.linux-amd64.tar.gz -o /tmp/go.tgz
          sudo tar -C /usr/local -xzf /tmp/go.tgz
          rm /tmp/go.tgz
          echo "/usr/local/go/bin" >> "$GITHUB_PATH"
          export PATH="/usr/local/go/bin:$PATH"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$PATH:$(go env GOPATH)/bin"
          gomobile init

      - name: "prebuild step (recipe's prebuild section)"
        working-directory: client
        run: |
          set -euo pipefail
          export PATH="/usr/local/go/bin:$PATH:$(go env GOPATH)/bin"
          export GOOS=android
          export GOARCH=arm64
          export CGO_ENABLED=1
          NDK_PAGE_SIZE_LDFLAGS="-Wl,-z,max-page-size=16384"
          NDK_PREBUILT="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -mindepth 1 -maxdepth 1 -type d | sort | head -1)"
          export CC="$NDK_PREBUILT/bin/aarch64-linux-android26-clang"
          export CXX="$NDK_PREBUILT/bin/aarch64-linux-android26-clang++"
          export CGO_LDFLAGS="$NDK_PAGE_SIZE_LDFLAGS -L$NDK_PREBUILT/sysroot/usr/lib/aarch64-linux-android/26"

          MOONLIGHT_ANDROID_TARGET=1 MOONLIGHT_SKIP_HOST=1 ./scripts/build_moonlight.sh
          mkdir -p android/app/libs
          gomobile bind -target android/arm64 -androidapi 26 -o android/app/libs/androidbridge.aar ./androidbridge
          echo "✓ androidbridge.aar built:"
          ls -la android/app/libs/androidbridge.aar

          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          go build -trimpath -tags="omitgui,ts_omit_gui,nosystray,ts_omit_systray" \
            -ldflags="-s -w -linkmode=external -extldflags=$NDK_PAGE_SIZE_LDFLAGS" \
            -o android/app/src/main/jniLibs/arm64-v8a/libtailscale.so tailscale.com/cmd/tailscale
          go build -trimpath -tags="omitgui,ts_omit_gui,nosystray,ts_omit_systray" \
            -ldflags="-s -w -linkmode=external -extldflags=$NDK_PAGE_SIZE_LDFLAGS" \
            -o android/app/src/main/jniLibs/arm64-v8a/libtailscaled.so tailscale.com/cmd/tailscaled
          echo "✓ tailscale libs built"

          env -u CC -u CXX -u CGO_LDFLAGS GOOS=linux GOARCH=amd64 go install fyne.io/tools/cmd/fyne@v1.7.2
          FYNE_BIN="$(go env GOPATH)/bin/fyne"
          cp VERSION cmd/android/VERSION
          cd cmd/android
          "$FYNE_BIN" package --target android/arm64 --tags "nosystray noselfupdate" \
            --app-id io.usbridge.client --name "USBridge Client" \
            --app-version "$(cat ../../VERSION)" --icon ../../Icon.png --release
          cd ../..
          unzip -q -o cmd/android/USBridge_Client.apk -d /tmp/fyne-scaffold
          cp /tmp/fyne-scaffold/lib/arm64-v8a/libUSBridge_Client.so \
            android/app/src/main/jniLibs/arm64-v8a/
          rm -rf /tmp/fyne-scaffold
          echo "✓ libUSBridge_Client.so extracted"
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: gradle (market flavor assemble)
        working-directory: client/android
        run: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew assembleMarketRelease --no-daemon

      - name: Report result
        run: |
          find client/android/app/build/outputs -name "*.apk" -exec ls -la {} \;
