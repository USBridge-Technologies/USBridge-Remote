name: agent-build

on:
  push:
    paths:
      - "agent/**"
      - ".github/workflows/agent-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: matrix.name != 'windows'
        with:
          go-version-file: agent/go.mod

      - name: Install Linux build deps (Fyne/X11)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Setup MSYS2 UCRT64 (Windows CGO toolchain)
        if: matrix.name == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-go mingw-w64-ucrt-x86_64-gcc

      - name: Build
        if: matrix.name != 'windows'
        working-directory: agent
        run: go build -v ./cmd/usbridge_agent

      - name: Vet
        if: matrix.name != 'windows'
        working-directory: agent
        run: go vet ./...

      - name: Build + Vet (Windows, MSYS2 UCRT64)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        working-directory: agent
        run: |
          go build -v ./cmd/usbridge_agent
          go vet ./...
