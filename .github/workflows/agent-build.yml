name: agent-build

on:
  push:
    paths:
      - "agent/**"
      - ".github/workflows/agent-build.yml"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        if: matrix.name != 'windows'
        with:
          go-version-file: agent/go.mod

      - name: Install Linux build deps (Fyne/X11)
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Setup MSYS2 UCRT64 (Windows CGO toolchain)
        if: matrix.name == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-go mingw-w64-ucrt-x86_64-gcc

      - name: Build
        if: matrix.name != 'windows'
        working-directory: agent
        run: go build -v ./cmd/usbridge_agent

      - name: Vet
        if: matrix.name != 'windows'
        working-directory: agent
        run: go vet ./...

      - name: Build + Vet (Windows, MSYS2 UCRT64)
        if: matrix.name == 'windows'
        shell: msys2 {0}
        working-directory: agent
        # -unsafeptr=false: internal/clipboard/backend_windows.go's
        # GlobalLock/GlobalAlloc calls go through syscall.Proc.Call(), which
        # returns a plain uintptr for what's actually a native Windows
        # handle/memory address -- vet's unsafeptr analyzer flags every
        # unsafe.Pointer(uintptr) conversion whose uintptr traces back to
        # *any* function call, with no way to restructure the code (verified
        # live: even a trivial `func f(p uintptr) unsafe.Pointer { return
        # unsafe.Pointer(p) }` in complete isolation triggers it) to satisfy
        # it while still calling the Win32 API this way. This is the
        # standard, widely-accepted false positive for this exact
        # syscall.Proc.Call()-returns-a-handle pattern -- real unsafeptr
        # bugs elsewhere (a Go heap pointer smuggled through uintptr across
        # a GC-unsafe window) are still caught, since this only disables the
        # one specific analyzer, not vet as a whole.
        run: |
          go build -v ./cmd/usbridge_agent
          go vet -unsafeptr=false ./...
