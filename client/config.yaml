# USBridge Client Configuration

# USBridge 2 connection (as client)
# IP address is entered in the interface address bar
usb_port: 8080
api_timeout: 30

# NBD server (as server)
nbd_port: 10809
max_clients: 5
scan_paths:
  - "./iso"
  - "/home/user/iso"
  - "/mnt/iso"
supported_types:
  - ".iso"
  - ".img"
  - ".vmdk"
  - ".vdi"

# Video UDP (new protocol, minimal latency)
video_udp_port: 55000

# Video settings
video_bitrate: 2000
video_width: 640
video_height: 480
video_fps: 30

# Audio settings
audio_codec: "Opus"
audio_bitrate: 128
audio_sample_rate: 48000
audio_channels: 2

# UI settings
window_width: 1200
window_height: 800
theme: "light"
log_level: "debug"
