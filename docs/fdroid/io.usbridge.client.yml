AutoName: USBridge Client

RepoType: git
Repo: https://github.com/USBridge-Technologies/USBridge-Remote.git

Builds:
  - versionName: 2.1.13
    versionCode: 20113
    commit: 38b70a46d16b47fab691672a7b1ef4c31b760fa6
    subdir: client/android
    submodules: true
    init: "curl -sSL https://go.dev/dl/go1.25.12.linux-amd64.tar.gz -o /tmp/go.tgz\n\
      tar -C /usr/local -xzf /tmp/go.tgz\nrm /tmp/go.tgz\nexport PATH=\"/usr/local/go/bin:$PATH\"\
      \ngo install golang.org/x/mobile/cmd/gomobile@latest\ngo install golang.org/x/mobile/cmd/gobind@latest\n\
      export PATH=\"$PATH:$(go env GOPATH)/bin\"\ngomobile init\n"
    gradle:
      - market
    prebuild: "export PATH=\"/usr/local/go/bin:$PATH:$(go env GOPATH)/bin\"\nexport\
      \ GOOS=android\nexport GOARCH=arm64\nexport CGO_ENABLED=1\nNDK_PAGE_SIZE_LDFLAGS=\"\
      -Wl,-z,max-page-size=16384\"\nNDK_PREBUILT=\"$(find \"$ANDROID_NDK_HOME/toolchains/llvm/prebuilt\"\
      \ -mindepth 1 -maxdepth 1 -type d | sort | head -1)\"\nexport CC=\"$NDK_PREBUILT/bin/aarch64-linux-android26-clang\"\
      \nexport CXX=\"$NDK_PREBUILT/bin/aarch64-linux-android26-clang++\"\nexport CGO_LDFLAGS=\"\
      $NDK_PAGE_SIZE_LDFLAGS -L$NDK_PREBUILT/sysroot/usr/lib/aarch64-linux-android/26\"\
      \ncd ..\nMOONLIGHT_ANDROID_TARGET=1 MOONLIGHT_SKIP_HOST=1 ./scripts/build_moonlight.sh\n\
      mkdir -p android/app/libs\ngomobile bind -target android/arm64 -androidapi 26\
      \ -o android/app/libs/androidbridge.aar ./androidbridge\nmkdir -p android/app/src/main/jniLibs/arm64-v8a\n\
      go build -trimpath -tags=\"omitgui,ts_omit_gui,nosystray,ts_omit_systray\" -ldflags=\"\
      -s -w -linkmode=external -extldflags=$NDK_PAGE_SIZE_LDFLAGS\" -o android/app/src/main/jniLibs/arm64-v8a/libtailscale.so\
      \ tailscale.com/cmd/tailscale\ngo build -trimpath -tags=\"omitgui,ts_omit_gui,nosystray,ts_omit_systray\"\
      \ -ldflags=\"-s -w -linkmode=external -extldflags=$NDK_PAGE_SIZE_LDFLAGS\" -o\
      \ android/app/src/main/jniLibs/arm64-v8a/libtailscaled.so tailscale.com/cmd/tailscaled\n\
      env -u CC -u CXX -u CGO_LDFLAGS GOOS=linux GOARCH=amd64 go install fyne.io/tools/cmd/fyne@v1.7.2\n\
      FYNE_BIN=\"$(go env GOPATH)/bin/fyne\"\ncp VERSION cmd/android/VERSION\ncd cmd/android\n\
      \"$FYNE_BIN\" package --target android/arm64 --tags \"nosystray noselfupdate\"\
      \ --app-id io.usbridge.client --name \"USBridge Client\" --app-version \"$(cat\
      \ ../../VERSION)\" --icon ../../Icon.png --release\ncd ../..\nunzip -q -o cmd/android/USBridge_Client.apk\
      \ -d /tmp/fyne-scaffold\ncp /tmp/fyne-scaffold/lib/arm64-v8a/libUSBridge_Client.so\
      \ android/app/src/main/jniLibs/arm64-v8a/\nrm -rf /tmp/fyne-scaffold\ncd android\n"
    ndk: r27c

MaintainerNotes: |
  This build targets the "market" Gradle flavor specifically -- no
  self-update, no REQUEST_INSTALL_PACKAGES -- see
  client/internal/update/update_disabled.go and docs/AUTO_UPDATE.md in the
  source tree.

  The init/prebuild/gradle steps below were validated end-to-end (real,
  full-size, functional APK) via a scratch GitHub Actions run on x86_64 --
  same architecture family as this buildserver, though not literally it, so
  some iteration against build logs here is expected. Also requested
  inclusion in IzzyOnDroid in parallel: see
  https://codeberg.org/IzzyOnDroid/repodata/issues/435

