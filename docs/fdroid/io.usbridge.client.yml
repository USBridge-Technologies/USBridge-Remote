Categories:
  - Connectivity
  - System
License: GPL-3.0-only
AuthorName: USBridge Technologies
SourceCode: https://github.com/USBridge-Technologies/USBridge-Remote
IssueTracker: https://github.com/USBridge-Technologies/USBridge-Remote/issues
Changelog: https://github.com/USBridge-Technologies/USBridge-Remote/releases

AutoName: USBridge Client

RepoType: git
Repo: https://github.com/USBridge-Technologies/USBridge-Remote.git

Builds:
  - versionName: 2.1.13
    versionCode: 20113
    commit: 38b70a46d16b47fab691672a7b1ef4c31b760fa6
    subdir: client/android
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y build-essential cmake
    init:
      - mkdir -p $HOME/goroot
      - curl -sSL https://go.dev/dl/go1.25.12.linux-amd64.tar.gz -o /tmp/go.tgz
      - tar -C $HOME/goroot --strip-components=1 -xzf /tmp/go.tgz
      - rm /tmp/go.tgz
      - export PATH="$HOME/goroot/bin:$PATH"
      - go install golang.org/x/mobile/cmd/gomobile@latest
      - go install golang.org/x/mobile/cmd/gobind@latest
      - export PATH="$PATH:$(go env GOPATH)/bin"
      - gomobile init
    gradle:
      - market
    prebuild:
      - export PATH="$HOME/goroot/bin:$PATH"
      - export PATH="$PATH:$(go env GOPATH)/bin"
      - export GOOS=android
      - export GOARCH=arm64
      - export CGO_ENABLED=1
      - NDK_PAGE_SIZE_LDFLAGS="-Wl,-z,max-page-size=16384"
      - NDK_PREBUILT="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -mindepth
        1 -maxdepth 1 -type d | sort | head -1)"
      - export CC="$NDK_PREBUILT/bin/aarch64-linux-android26-clang"
      - export CXX="$NDK_PREBUILT/bin/aarch64-linux-android26-clang++"
      - export CGO_LDFLAGS="$NDK_PAGE_SIZE_LDFLAGS -L$NDK_PREBUILT/sysroot/usr/lib/aarch64-linux-android/26"
      - cd ..
      - SDKMANAGER="$(find /opt/android-sdk/cmdline-tools -name sdkmanager -type f
        2>/dev/null | sort -V | tail -1)"
      - test -n "$SDKMANAGER" || SDKMANAGER="$(find /opt/android-sdk -maxdepth 4 -name
        sdkmanager -type f | sort -V | tail -1)"
      - '"$SDKMANAGER" "platforms;android-26" "platforms;android-35" "build-tools;35.0.0"'
      - MOONLIGHT_ANDROID_TARGET=1 MOONLIGHT_SKIP_HOST=1 ./scripts/build_moonlight.sh
        >/tmp/moonlight-build.log 2>&1 || (tail -c 300000 /tmp/moonlight-build.log;
        exit 1)
      - mkdir -p android/app/libs
      - gomobile bind -target android/arm64 -androidapi 26 -o android/app/libs/androidbridge.aar
        ./androidbridge
      - mkdir -p android/app/src/main/jniLibs/arm64-v8a
      - go build -trimpath -tags="omitgui,ts_omit_gui,nosystray,ts_omit_systray" -ldflags="-s
        -w -linkmode=external -extldflags=$NDK_PAGE_SIZE_LDFLAGS" -o android/app/src/main/jniLibs/arm64-v8a/libtailscale.so
        tailscale.com/cmd/tailscale
      - go build -trimpath -tags="omitgui,ts_omit_gui,nosystray,ts_omit_systray" -ldflags="-s
        -w -linkmode=external -extldflags=$NDK_PAGE_SIZE_LDFLAGS" -o android/app/src/main/jniLibs/arm64-v8a/libtailscaled.so
        tailscale.com/cmd/tailscaled
      - env -u CC -u CXX -u CGO_LDFLAGS GOOS=linux GOARCH=amd64 go install fyne.io/tools/cmd/fyne@v1.7.2
      - FYNE_BIN="$(go env GOPATH)/bin/fyne"
      - cp VERSION cmd/android/VERSION
      - cd cmd/android
      - '"$FYNE_BIN" package --target android/arm64 --tags "nosystray noselfupdate"
        --app-id io.usbridge.client --name "USBridge Client" --app-version "$(cat
        ../../VERSION)" --icon ../../Icon.png --release'
      - cd ../..
      - unzip -q -o cmd/android/USBridge_Client.apk -d /tmp/fyne-scaffold
      - cp /tmp/fyne-scaffold/lib/arm64-v8a/libUSBridge_Client.so android/app/src/main/jniLibs/arm64-v8a/
      - rm -rf /tmp/fyne-scaffold
      - cd android
    ndk: r27c

MaintainerNotes: |
  This build targets the "market" Gradle flavor specifically -- no
  self-update, no REQUEST_INSTALL_PACKAGES -- see
  client/internal/update/update_disabled.go and docs/AUTO_UPDATE.md in the
  source tree.

  The init/prebuild/gradle steps below were validated end-to-end (real,
  full-size, functional APK) via a scratch GitHub Actions run on x86_64 --
  same architecture family as this buildserver, though not literally it, so
  some iteration against build logs here is expected. Also requested
  inclusion in IzzyOnDroid in parallel: see
  https://codeberg.org/IzzyOnDroid/repodata/issues/435

AutoUpdateMode: None
UpdateCheckMode: None
