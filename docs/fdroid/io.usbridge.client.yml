# DRAFT build recipe for the official F-Droid repo (fdroiddata).
#
# NOT submitted anywhere yet. This is a starting point for a merge request
# against https://gitlab.com/fdroid/fdroiddata — path there would be
# metadata/io.usbridge.client.yml. Unlike IzzyOnDroid, F-Droid's own build
# server compiles this from source in an isolated environment we don't
# control, so this WILL need iteration with their reviewers/build logs
# before it actually works — the Go + gomobile + NDK + native-submodule
# toolchain this app needs is well outside a plain Gradle build, and
# nothing here has been validated against F-Droid's real buildserver.
# (Precedent worth comparing against: syncthing-android's real fdroiddata
# recipe solves the same class of problem — Go core + gomobile + Android UI.)
#
# Targets the "market" flavor specifically (client/android/app/build.gradle.kts)
# — no self-update, no REQUEST_INSTALL_PACKAGES — see
# client/internal/update/update_disabled.go and docs/AUTO_UPDATE.md.

Categories:
  - Connectivity
  - System
License: GPL-3.0-only
AuthorName: USBridge Technologies
SourceCode: https://github.com/USBridge-Technologies/USBridge-Remote
IssueTracker: https://github.com/USBridge-Technologies/USBridge-Remote/issues
Changelog: https://github.com/USBridge-Technologies/USBridge-Remote/releases

AutoName: USBridge Client
Summary: Hybrid BIOS-level KVM + remote desktop client
Description: |
  USBridge Client is a hybrid remote-access app: BIOS-level control via
  USBridge-KVM hardware (works even before the OS boots), plus lightweight
  software remote desktop over the Moonlight streaming protocol —
  interoperable with Sunshine and NVIDIA GameStream-compatible hosts.

  This build has no self-update mechanism and requests no
  install-unknown-apps permission; see client/internal/update in the
  source tree.

RepoType: git
Repo: https://github.com/USBridge-Technologies/USBridge-Remote.git

Builds:
  - versionName: 2.1.13
    versionCode: 20113
    # Pinned to the commit on the `test` branch that has this exact
    # versionName/versionCode (client/VERSION-driven). TODO: repin once
    # this lands on `main` -- F-Droid's buildserver should track the
    # public release branch, not a working branch.
    commit: 39b027509d0c69d4100e2440b4316bbb3d5e949e
    subdir: client/android
    submodules: true

    # Confirmed live (own x86_64 CI run, not their buildserver, but same
    # arch/distro family): apt's golang-go is 1.22, and golang.org/x/mobile
    # (gomobile) requires >=1.25 -- too old, don't rely on apt for Go at
    # all. Fetch a pinned upstream tarball directly instead.
    init: |
      curl -sSL https://go.dev/dl/go1.25.12.linux-amd64.tar.gz -o /tmp/go.tgz
      sudo tar -C /usr/local -xzf /tmp/go.tgz
      rm /tmp/go.tgz
      export PATH="/usr/local/go/bin:$PATH"
      go install golang.org/x/mobile/cmd/gomobile@latest
      go install golang.org/x/mobile/cmd/gobind@latest
      export PATH="$PATH:$(go env GOPATH)/bin"
      gomobile init
    prebuild: |
      export PATH="/usr/local/go/bin:$PATH:$(go env GOPATH)/bin"
      export GOOS=android
      export GOARCH=arm64
      export CGO_ENABLED=1
      # 16 KB page-size alignment -- see
      # client/scripts/build_android_gradle.sh's NDK_PAGE_SIZE_LDFLAGS.
      NDK_PAGE_SIZE_LDFLAGS="-Wl,-z,max-page-size=16384"
      # Target API 26 explicitly (matches minSdk) -- an untargeted NDK
      # clang defaults to API 21, which gates out libaaudio/libvulkan
      # entirely regardless of -L search paths (a real regression this
      # project already hit once, see
      # client/scripts/build_android_gradle.sh's comment on the same
      # setup_android_ndk_toolchain_env call).
      NDK_PREBUILT="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -mindepth 1 -maxdepth 1 -type d | sort | head -1)"
      export CC="$NDK_PREBUILT/bin/aarch64-linux-android26-clang"
      export CXX="$NDK_PREBUILT/bin/aarch64-linux-android26-clang++"
      export CGO_LDFLAGS="$NDK_PAGE_SIZE_LDFLAGS -L$NDK_PREBUILT/sysroot/usr/lib/aarch64-linux-android/26"
      cd ..
      MOONLIGHT_ANDROID_TARGET=1 MOONLIGHT_SKIP_HOST=1 ./scripts/build_moonlight.sh
      mkdir -p android/app/libs
      gomobile bind -target android/arm64 -androidapi 26 -o android/app/libs/androidbridge.aar ./androidbridge

      # Tailscale CLI + daemon (client/scripts/build_android_gradle.sh's
      # step 1.5) -- plain `go build` executables, not -buildmode=c-shared,
      # so -linkmode=external is needed to make -extldflags apply at all.
      mkdir -p android/app/src/main/jniLibs/arm64-v8a
      go build -trimpath -tags="omitgui,ts_omit_gui,nosystray,ts_omit_systray" \
        -ldflags="-s -w -linkmode=external -extldflags=$NDK_PAGE_SIZE_LDFLAGS" \
        -o android/app/src/main/jniLibs/arm64-v8a/libtailscale.so tailscale.com/cmd/tailscale
      go build -trimpath -tags="omitgui,ts_omit_gui,nosystray,ts_omit_systray" \
        -ldflags="-s -w -linkmode=external -extldflags=$NDK_PAGE_SIZE_LDFLAGS" \
        -o android/app/src/main/jniLibs/arm64-v8a/libtailscaled.so tailscale.com/cmd/tailscaled

      # Main app native library: fyne package builds cmd/android as a
      # -buildmode=c-shared .so, wrapped in its own throwaway scaffold APK
      # -- extract just the .so, same as
      # client/scripts/build_android_gradle.sh's steps 3-4.
      go install fyne.io/tools/cmd/fyne@v1.7.2
      FYNE_BIN="$(go env GOPATH)/bin/fyne"
      cp VERSION cmd/android/VERSION
      cd cmd/android
      "$FYNE_BIN" package --target android/arm64 --tags "nosystray noselfupdate" \
        --app-id io.usbridge.client --name "USBridge Client" \
        --app-version "$(cat ../../VERSION)" --icon ../../Icon.png --release
      cd ../..
      unzip -q -o cmd/android/USBridge_Client.apk -d /tmp/fyne-scaffold
      cp /tmp/fyne-scaffold/lib/arm64-v8a/libUSBridge_Client.so \
        android/app/src/main/jniLibs/arm64-v8a/
      rm -rf /tmp/fyne-scaffold

      cd android

    gradle:
      - market

    ndk: r27c  # TODO: confirm against whatever's actually available/works

AutoUpdateMode: None  # manual for now -- versionName isn't a plain git tag yet
UpdateCheckMode: None
